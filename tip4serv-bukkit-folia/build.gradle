plugins {
    id 'java'
}

group = 'fr.murga'
version = '1.3.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    // Spigot API - compileOnly so it's not included in the jar
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'

    // JSON parsing library - included in jar
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
}

// Include dependencies and plugin.yml in the jar
jar {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from('plugin.yml')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    archiveBaseName = 'Tip4Serv'
    archiveVersion = version

    manifest {
        attributes 'Implementation-Title': 'Tip4Serv',
                   'Implementation-Version': version
    }
}
